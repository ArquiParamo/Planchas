<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Visor navegable de planchas, presentación de Canva y renders del proyecto Arquitectura de Páramo."
    />
    <title>Planchas | Arquitectura de Páramo</title>
    <link rel="preload" as="image" href="./assets/boards/board-01-large.webp" />
    <link rel="preload" as="image" href="./assets/boards/board-02-large.webp" />
    <link rel="preload" as="image" href="./assets/boards/board-03-large.webp" />
    <link rel="preload" as="image" href="./assets/boards/board-04-large.webp" />
    <link rel="stylesheet" href="./styles.css?v=20260607-010500" />
    <script src="./assets/config.js?v=20260607-010500"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="./app.js?v=20260607-010500" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Controles de presentación">
        <header class="panel-header">
          <div class="panel-title-row">
            <div class="panel-title-copy">
              <p class="eyebrow">Entrega final</p>
              <h1>Planchas y renders</h1>
              <p class="intro-text">Arquitectura de Páramo</p>
            </div>
            <div class="toolbar action-toolbar" aria-label="Controles rápidos">
              <div class="primary-actions">
                <button class="action-button" id="resetView" type="button" title="Recentrar presentación" aria-label="Recentrar presentación">
                  <i data-lucide="crosshair" aria-hidden="true"></i>
                  <span>Recentrar</span>
                </button>
                <a class="action-button" id="openMap" href="https://mapa-biodiverso-chingaza.arqiparamo.workers.dev/" target="_blank" rel="noreferrer" title="Abrir mapa biodiverso" aria-label="Abrir mapa biodiverso">
                  <i data-lucide="map" aria-hidden="true"></i>
                  <span>Mapa</span>
                </a>
                <a class="action-button" id="openSchema" href="https://esq-gestion.arqiparamo.workers.dev/" target="_blank" rel="noreferrer" title="Abrir esquema de gestión" aria-label="Abrir esquema de gestión">
                  <i data-lucide="users" aria-hidden="true"></i>
                  <span>Esc. gestión</span>
                </a>
              </div>
              <div class="internal-actions" aria-label="Herramientas de vista">
                <button class="internal-tool" id="fitBoard" type="button" title="Canva pantalla completa" aria-label="Canva pantalla completa" aria-pressed="false">
                  <i data-lucide="maximize-2" aria-hidden="true"></i>
                </button>
                <button class="internal-tool" id="zoomOut" type="button" title="Alejar" aria-label="Alejar">
                  <i data-lucide="zoom-out" aria-hidden="true"></i>
                </button>
                <button class="internal-tool" id="zoomIn" type="button" title="Acercar" aria-label="Acercar">
                  <i data-lucide="zoom-in" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        </header>

        <div class="view-status" id="sourcePill">Presentación</div>

        <nav class="view-switcher" aria-label="Apartados">
          <button class="view-switch is-active" type="button" data-view="presentacion">
            <i data-lucide="presentation" aria-hidden="true"></i>
            <span>Presentación</span>
          </button>
          <button class="view-switch" type="button" data-view="renders">
            <i data-lucide="images" aria-hidden="true"></i>
            <span>Renders</span>
          </button>
        </nav>
      </aside>

      <main class="workspace">
        <section class="view is-active presentation-view" id="view-presentacion" aria-labelledby="presentationHeading">
          <h2 class="sr-only" id="presentationHeading">Planchas y Canva</h2>
          <div class="pan-viewport" id="presentationViewport" aria-label="Espacio navegable de presentación">
            <div class="pan-content" id="presentationContent">
              <section class="boards-strip" id="boardsStrip" aria-label="Cuatro planchas"></section>
              <section class="canva-stage" id="canvaStage" aria-labelledby="canvaHeading">
                <div class="canva-heading">
                  <div>
                    <p class="toolbar-kicker">Canva</p>
                    <h2 id="canvaHeading">Presentación del proyecto</h2>
                  </div>
                  <a class="tool-button" id="canvaExternal" target="_blank" rel="noreferrer">Abrir Canva</a>
                </div>
                <div class="canva-frame-shell" id="canvaFrameShell">
                  <p class="pdf-loader" id="canvaLoader">Verificando visor público de Canva</p>
                </div>
              </section>
            </div>
          </div>
        </section>

        <section class="view renders-view" id="view-renders" aria-labelledby="rendersHeading">
          <h2 class="sr-only" id="rendersHeading">Renders</h2>
          <div class="render-strip" id="renderGrid" aria-label="Galería de renders"></div>
        </section>
      </main>
    </div>

    <dialog class="render-dialog" id="renderDialog" aria-labelledby="renderTitle">
      <div class="render-dialog-toolbar">
        <button class="dialog-tool" id="closeRender" type="button" title="Cerrar" aria-label="Cerrar">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
        <div class="render-dialog-copy">
          <h2 id="renderTitle">Vista ampliada</h2>
          <p id="renderCaption"></p>
        </div>
        <div class="render-dialog-actions" aria-label="Controles del render">
          <button class="dialog-tool" id="prevRender" type="button" title="Vista anterior" aria-label="Vista anterior">
            <i data-lucide="chevron-left" aria-hidden="true"></i>
          </button>
          <button class="dialog-tool" id="nextRender" type="button" title="Vista siguiente" aria-label="Vista siguiente">
            <i data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
          <button class="dialog-tool" id="renderFullscreen" type="button" title="Pantalla completa" aria-label="Pantalla completa" aria-pressed="false">
            <i data-lucide="maximize-2" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="render-stage" id="renderStage">
        <img id="renderPreview" alt="" draggable="false" />
      </div>
    </dialog>
  </body>
</html>
