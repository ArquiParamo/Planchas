<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Visor navegable de planchas, presentación de Canva y renders del proyecto Arquitectura de Páramo."
    />
    <title>Planchas | Arquitectura de Páramo</title>
    <link rel="preload" as="image" href="./assets/boards/board-01-preview.webp" />
    <link rel="preload" as="image" href="./assets/boards/board-02-preview.webp" />
    <link rel="preload" as="image" href="./assets/boards/board-03-preview.webp" />
    <link rel="preload" as="image" href="./assets/boards/board-04-preview.webp" />
    <link rel="stylesheet" href="./styles.css?v=20260606-090500" />
    <script src="./assets/config.js?v=20260606-090500"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="./app.js?v=20260606-090500" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-panel" aria-label="Navegación de presentación">
        <a class="brand" href="#presentacion" aria-label="Ir a presentación">
          <img src="./assets/brand/javeriana-logo.png" alt="" />
          <span>
            <strong>Presentación</strong>
            <small>Arquitectura de Páramo</small>
          </span>
        </a>

        <div class="side-actions" aria-label="Controles principales">
          <button class="action-button" id="resetView" type="button" title="Recentrar presentación" aria-label="Recentrar presentación">
            <i data-lucide="crosshair" aria-hidden="true"></i>
            <span>Recentrar</span>
          </button>
          <a class="action-button" id="openMap" href="https://mapa-biodiverso-chingaza.arqiparamo.workers.dev/" target="_blank" rel="noreferrer" title="Abrir mapa biodiverso" aria-label="Abrir mapa biodiverso">
            <i data-lucide="map" aria-hidden="true"></i>
            <span>Mapa</span>
          </a>
          <a class="action-button" id="openSchema" href="https://esq-gestion.arqiparamo.workers.dev/" target="_blank" rel="noreferrer" title="Abrir esquema de gestión" aria-label="Abrir esquema de gestión">
            <i data-lucide="users" aria-hidden="true"></i>
            <span>Esc. gestión</span>
          </a>
        </div>

        <span class="source-pill" id="sourcePill">Presentación</span>

        <nav class="side-menu" aria-label="Apartados">
          <button class="nav-button is-active" type="button" data-view="presentacion">
            <i data-lucide="presentation" aria-hidden="true"></i>
            <span>Presentación</span>
          </button>
          <button class="nav-button" type="button" data-view="renders">
            <i data-lucide="images" aria-hidden="true"></i>
            <span>Renders</span>
          </button>
        </nav>
      </aside>

      <main class="workspace">
        <section class="view is-active presentation-view" id="view-presentacion" aria-labelledby="presentationHeading">
          <div class="section-head">
            <div>
              <p class="eyebrow">Entrega final</p>
              <h1 id="presentationHeading">Planchas y Canva</h1>
            </div>
            <div class="toolbar-actions" aria-label="Herramientas de navegación">
              <button class="tool-button icon-tool" id="zoomOut" type="button" title="Alejar" aria-label="Alejar">
                <i data-lucide="zoom-out" aria-hidden="true"></i>
              </button>
              <button class="tool-button icon-tool" id="fitBoard" type="button" title="Recentrar" aria-label="Recentrar">
                <i data-lucide="crosshair" aria-hidden="true"></i>
              </button>
              <button class="tool-button icon-tool" id="zoomIn" type="button" title="Acercar" aria-label="Acercar">
                <i data-lucide="zoom-in" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="pan-viewport" id="presentationViewport" aria-label="Espacio navegable de presentación">
            <div class="pan-content" id="presentationContent">
              <section class="boards-strip" id="boardsStrip" aria-label="Cuatro planchas"></section>
              <section class="canva-stage" id="canvaStage" aria-labelledby="canvaHeading">
                <div class="canva-heading">
                  <div>
                    <p class="toolbar-kicker">Canva</p>
                    <h2 id="canvaHeading">Presentación del proyecto</h2>
                  </div>
                  <a class="tool-button" id="canvaExternal" target="_blank" rel="noreferrer">Abrir Canva</a>
                </div>
                <div class="canva-frame-shell" id="canvaFrameShell">
                  <p class="pdf-loader" id="canvaLoader">Verificando visor público de Canva</p>
                </div>
              </section>
            </div>
          </div>
        </section>

        <section class="view renders-view" id="view-renders" aria-labelledby="rendersHeading">
          <div class="section-head">
            <div>
              <p class="eyebrow">Visualizaciones</p>
              <h1 id="rendersHeading">Renders</h1>
            </div>
          </div>
          <div class="render-strip" id="renderGrid" aria-label="Galería de renders"></div>
        </section>
      </main>
    </div>

    <dialog class="render-dialog" id="renderDialog">
      <button class="dialog-close" id="closeRender" type="button" aria-label="Cerrar">Cerrar</button>
      <div class="render-stage" id="renderStage">
        <img id="renderPreview" alt="" />
      </div>
      <p id="renderCaption"></p>
    </dialog>
  </body>
</html>
